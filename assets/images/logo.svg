<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%" style="background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); border-radius: 16px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Decorative Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="100" y1="0" x2="100" y2="200" />
    <line x1="200" y1="0" x2="200" y2="200" />
    <line x1="300" y1="0" x2="300" y2="200" />
    <line x1="400" y1="0" x2="400" y2="200" />
    <line x1="500" y1="0" x2="500" y2="200" />
    <line x1="600" y1="0" x2="600" y2="200" />
    <line x1="700" y1="0" x2="700" y2="200" />
  </g>

  <!-- Logo Mark (Left Side Buildings/Property Matrix Symbol) -->
  <g transform="translate(45, 30)">
    <!-- Shadow Base -->
    <ellipse cx="65" cy="135" rx="60" ry="8" fill="#000000" opacity="0.4" filter="url(#glow)"/>

    <!-- Building 1 (Industrial / Logistics Low-Rise) -->
    <rect x="10" y="75" width="40" height="55" rx="4" fill="url(#accent-grad)" />
    <rect x="18" y="85" width="8" height="8" rx="1" fill="#FFFFFF" opacity="0.8" />
    <rect x="32" y="85" width="8" height="8" rx="1" fill="#FFFFFF" opacity="0.8" />
    <rect x="18" y="100" width="8" height="8" rx="1" fill="#FFFFFF" opacity="0.8" />
    <rect x="32" y="100" width="8" height="8" rx="1" fill="#FFFFFF" opacity="0.8" />

    <!-- Building 2 (Main Skyscraper Tower - Commercial/Office) -->
    <rect x="42" y="30" width="48" height="100" rx="6" fill="url(#primary-grad)" filter="url(#glow)"/>
    <!-- Windows Matrix -->
    <rect x="50" y="42" width="10" height="10" rx="2" fill="#FFFFFF" opacity="0.9" />
    <rect x="68" y="42" width="10" height="10" rx="2" fill="#FFFFFF" opacity="0.9" />
    <rect x="50" y="58" width="10" height="10" rx="2" fill="#FFFFFF" opacity="0.9" />
    <rect x="68" y="58" width="10" height="10" rx="2" fill="#FFFFFF" opacity="0.9" />
    <rect x="50" y="74" width="10" height="10" rx="2" fill="#FFFFFF" opacity="0.9" />
    <rect x="68" y="74" width="10" height="10" rx="2" fill="#FFFFFF" opacity="0.9" />
    <rect x="50" y="90" width="10" height="10" rx="2" fill="#FFFFFF" opacity="0.9" />
    <rect x="68" y="90" width="10" height="10" rx="2" fill="#FFFFFF" opacity="0.9" />
    <rect x="58" y="110" width="16" height="20" rx="2" fill="#DBEAFE" />

    <!-- Building 3 (Residential High-Rise) -->
    <polygon points="98,55 125,35 152,55" fill="url(#gold-grad)" />
    <rect x="98" y="55" width="54" height="75" rx="2" fill="url(#gold-grad)" />
    <rect x="106" y="65" width="10" height="12" rx="1" fill="#FFFFFF" opacity="0.85" />
    <rect x="122" y="65" width="10" height="12" rx="1" fill="#FFFFFF" opacity="0.85" />
    <rect x="138" y="65" width="8" height="12" rx="1" fill="#FFFFFF" opacity="0.85" />
    <rect x="106" y="83" width="10" height="12" rx="1" fill="#FFFFFF" opacity="0.85" />
    <rect x="122" y="83" width="10" height="12" rx="1" fill="#FFFFFF" opacity="0.85" />
    <rect x="138" y="83" width="8" height="12" rx="1" fill="#FFFFFF" opacity="0.85" />

    <!-- Connection Growth Line Overlay -->
    <path d="M 15 110 Q 65 40 145 30" fill="none" stroke="#60A5FA" stroke-width="3" stroke-dasharray="4,4" opacity="0.7"/>
    <circle cx="145" cy="30" r="5" fill="#60A5FA"/>
  </g>

  <!-- Typography Text Group -->
  <g transform="translate(230, 75)">
    <!-- Primary Title -->
    <text x="0" y="45" font-size="52" font-weight="900" fill="url(#text-grad)" letter-spacing="4">REPMS</text>
    
    <!-- Tagline Badge -->
    <rect x="235" y="10" width="165" height="28" rx="14" fill="#1E40AF" opacity="0.6"/>
    <text x="247" y="29" font-size="12" font-weight="700" fill="#60A5FA" letter-spacing="1">NEXT-GEN UI</text>

    <!-- Subtitle -->
    <text x="2" y="75" font-size="16" font-weight="600" fill="#94A3B8" letter-spacing="1.5">REAL ESTATE PROPERTY MANAGEMENT SYSTEM</text>
    
    <!-- Sub-tagline -->
    <text x="2" y="98" font-size="12" font-weight="500" fill="#64748B">Multi-Asset Platform • Pure HTML5 &amp; CSS3 Architecture • 4-Developer Parallel Workflow</text>
  </g>
</svg>
